<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100" height="125">
  <defs>
    <filter id="plnEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Yellow Rounded Rectangle -->
  <g filter="url(#plnEmblemShadow)">
    <rect x="2" y="2" width="96" height="121" rx="14" fill="#FFD100" stroke="#F59E0B" stroke-width="1.5" />

    <!-- Three Blue Waves (Hydro Energy) -->
    <!-- Wave 1 (Top Wave) -->
    <path d="M 10,75 
             C 22,68 30,82 42,75 
             C 54,68 62,82 74,75 
             C 82,70 86,75 88,75
             L 88,81 
             C 82,81 76,77 70,81 
             C 58,87 50,75 38,81 
             C 28,86 20,77 10,81 Z" 
          fill="#005BAA" />

    <!-- Wave 2 (Middle Wave) -->
    <path d="M 10,87 
             C 22,80 30,94 42,87 
             C 54,80 62,94 74,87 
             C 82,82 86,87 88,87
             L 88,93 
             C 82,93 76,89 70,93 
             C 58,99 50,87 38,93 
             C 28,98 20,89 10,93 Z" 
          fill="#005BAA" />

    <!-- Wave 3 (Bottom Wave) -->
    <path d="M 10,99 
             C 22,92 30,106 42,99 
             C 54,92 62,106 74,99 
             C 82,94 86,99 88,99
             L 88,105 
             C 82,105 76,101 70,105 
             C 58,111 50,99 38,105 
             C 28,110 20,101 10,105 Z" 
          fill="#005BAA" />

    <!-- Red Lightning Bolt (Petir Merah) -->
    <polygon points="41,12 22,66 45,66 32,112 78,54 54,54 70,12" fill="#EE2E24" />
  </g>
</svg>
