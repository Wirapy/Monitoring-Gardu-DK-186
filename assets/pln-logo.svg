<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <!-- Drop Shadow for Premium Feel -->
    <filter id="plnShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ================= EMBLEM PLN ================= -->
  <g transform="translate(10, 5)" filter="url(#plnShadow)">
    <!-- Yellow Rectangle Base with Rounded Corners -->
    <rect x="0" y="0" width="62" height="78" rx="8" fill="#FFD100" />

    <!-- Three Blue Waves (Hydro / Energy Source) -->
    <!-- Wave 1 (Top Wave) -->
    <path d="M 6,48 
             C 14,44 19,52 27,48 
             C 35,44 40,52 48,48 
             C 53,45 56,48 56,48
             L 56,52 
             C 52,52 48,49 44,52 
             C 36,56 31,48 23,52 
             C 17,55 12,49 6,52 Z" 
          fill="#005BAA" />

    <!-- Wave 2 (Middle Wave) -->
    <path d="M 6,56 
             C 14,52 19,60 27,56 
             C 35,52 40,60 48,56 
             C 53,53 56,56 56,56
             L 56,60 
             C 52,60 48,57 44,60 
             C 36,64 31,56 23,60 
             C 17,63 12,57 6,60 Z" 
          fill="#005BAA" />

    <!-- Wave 3 (Bottom Wave) -->
    <path d="M 6,64 
             C 14,60 19,68 27,64 
             C 35,60 40,68 48,64 
             C 53,61 56,64 56,64
             L 56,68 
             C 52,68 48,65 44,68 
             C 36,72 31,64 23,68 
             C 17,71 12,65 6,68 Z" 
          fill="#005BAA" />

    <!-- Red Lightning Bolt (Petir Merah) -->
    <polygon points="26,8 14,42 28,42 20,72 49,34 34,34 44,8" fill="#EE2E24" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(86, 0)">
    <!-- Main Bold "PLN" Letters -->
    <text x="0" y="48" 
          font-family="'Inter', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="40" 
          letter-spacing="2" 
          fill="#005BAA">PLN</text>
    
    <!-- Subtitle Text -->
    <text x="2" y="65" 
          font-family="'Inter', sans-serif" 
          font-weight="700" 
          font-size="10.5" 
          letter-spacing="1.2" 
          fill="#0F172A">PT PLN (PERSERO)</text>
          
    <text x="2" y="77" 
          font-family="'Inter', sans-serif" 
          font-weight="600" 
          font-size="8.5" 
          letter-spacing="0.8" 
          fill="#0284C7">UP3 CENGKARENG</text>
  </g>
</svg>
